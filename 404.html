<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Страница не найдена</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --deep-purple: #4c1d95;
            --neon-purple: #a855f7;
            --dark-purple: #3b0764;
            --dark-bg: #070709;
            --glass-bg: rgba(18, 18, 24, 0.75);
        }

        body {
            background-color: var(--dark-bg);
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .orb-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #120d1a 0%, #070709 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes orbit {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(8vw, 15vh) scale(1.1); }
            66% { transform: translate(-5vw, 10vh) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes pulseOrb {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        .orb-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, transparent 70%);
            top: -15%;
            left: -10%;
            animation: orbit 28s infinite ease-in-out, pulseOrb 9s infinite ease-in-out;
        }

        .orb-2 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(76, 29, 149, 0.5) 0%, transparent 70%);
            bottom: -15%;
            right: -5%;
            animation: orbit 32s infinite ease-in-out reverse, pulseOrb 11s infinite ease-in-out;
        }

        .orb-3 {
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, transparent 70%);
            top: 40%;
            left: 50%;
            animation: orbit 24s infinite ease-in-out, pulseOrb 7s infinite ease-in-out reverse;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .neon-text-dormant {
            color: #f3f4f6;
            text-shadow:
                0 0 10px rgba(168, 85, 247, 0.4),
                0 0 30px rgba(124, 58, 237, 0.3),
                0 0 60px rgba(76, 29, 149, 0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-scale-in {
            opacity: 0;
            animation: fadeInScale 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.35s; }
        .delay-3 { animation-delay: 0.55s; }
        .delay-4 { animation-delay: 0.75s; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(255, 255, 255, 0.03), rgba(124, 58, 237, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        .glass-card:hover::before {
            opacity: 1;
        }

        .glass-card:hover {
            transform: translateY(-6px) scale(1.005);
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.18), 0 0 0 1px rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.25);
            background: rgba(25, 25, 36, 0.85);
        }

        .shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: shimmer 6s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .divider-glow {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.4), rgba(124, 58, 237, 0.6), rgba(168, 85, 247, 0.4), transparent);
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(124, 58, 237, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e9d5ff;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(10px);
        }

        .home-btn:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(124, 58, 237, 0.25));
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
            color: #fff;
        }

        .glitch-text {
            animation: glitch 5s infinite;
        }

        @keyframes glitch {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; transform: translateX(2px); }
            94% { opacity: 1; transform: translateX(0); }
            96% { opacity: 0.7; transform: translateX(-2px); }
            97% { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="opacity-0 transition-opacity duration-1000">
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 md:px-8">
        <main class="max-w-3xl w-full text-center">

            <div class="mb-6 animate-fade-in delay-1 flex justify-center">
                <h1 class="text-8xl sm:text-9xl md:text-[10rem] font-black neon-text-dormant tracking-widest leading-none glitch-text" style="font-family: 'Montserrat', sans-serif;">
                    404
                </h1>
            </div>

            <div class="mb-8 animate-fade-in delay-2 flex justify-center">
                <span class="text-sm sm:text-base uppercase tracking-widest text-purple-300/80 font-semibold">
                    Страница не найдена
                </span>
            </div>

            <div class="mb-10 animate-fade-in delay-3 flex justify-center">
                <div class="divider-glow w-full"></div>
            </div>

            <div class="glass-card p-8 md:p-10 mb-10 text-left animate-fade-in delay-4 relative">
                <div class="shimmer"></div>
                <div class="absolute top-0 right-0 w-40 h-40 bg-purple-500/5 rounded-bl-full pointer-events-none"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-purple-500/3 rounded-tr-full pointer-events-none"></div>

                <div class="flex items-center gap-3 mb-5">
                    <div class="p-2.5 bg-purple-500/10 rounded-xl text-purple-400 border border-purple-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold text-white">Упс, вы заблудились</h2>
                </div>

                <p class="text-gray-300 leading-relaxed text-base md:text-lg mb-7">
                    Запрашиваемая страница не существует или была перемещена. Возможно, вы ввели неверный адрес или ссылка устарела.
                </p>

                <div class="p-5 rounded-2xl bg-black/30 border border-white/5 text-sm text-gray-400 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-purple-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Проверьте адрес или вернитесь на главную страницу.</span>
                    </div>
                    <a href="https://sociovor.mom" class="home-btn shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        Вернуться домой
                    </a>
                </div>
            </div>

        </main>
    </div>

    <script>
        window.onload = () => {
            document.body.classList.remove('opacity-0');
        };
    </script>
</body>
</html>
